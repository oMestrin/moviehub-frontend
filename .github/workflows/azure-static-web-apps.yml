name: Deploy — Azure Static Web Apps

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      HAS_SWA_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Testes de arquitetura do microfrontend
        run: npm test
      - name: Publicação ignorada (secret AZURE_STATIC_WEB_APPS_API_TOKEN não configurado)
        if: env.HAS_SWA_TOKEN != 'true'
        run: echo "O frontend foi publicado pelo deploy.sh. Para publicar pelo CI, configure AZURE_STATIC_WEB_APPS_API_TOKEN, VITE_APIM_SUBSCRIPTION_KEY e a variável VITE_BFF_URL."
      - name: Build (shell + remotes num único pacote)
        if: env.HAS_SWA_TOKEN == 'true'
        run: npm run build
        env:
          VITE_BFF_URL: ${{ vars.VITE_BFF_URL }}
          VITE_APIM_SUBSCRIPTION_KEY: ${{ secrets.VITE_APIM_SUBSCRIPTION_KEY }}
      - name: Publicar no Static Web Apps
        if: env.HAS_SWA_TOKEN == 'true'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: dist
          skip_app_build: true
          skip_api_build: true
